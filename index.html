    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SameeraVani",
      "url": "https://sameeravani-books.web.app/",
      "description": "Authentic Dvaita Vedanta classics, Nyaya Sudha, Bhagavad Gita, Brahmasutra, Upanishads, Sanskrit commentaries, and philosophy.",

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W2D1XFT7PV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-W2D1XFT7PV');

      // Intercept SPA location changes to track hits URL-wise in GA
      (function() {
        const pushState = history.pushState;
        const replaceState = history.replaceState;
        
        history.pushState = function() {
          const result = pushState.apply(this, arguments);
          window.dispatchEvent(new Event('locationchange'));
          return result;
        };
        
        history.replaceState = function() {
          const result = replaceState.apply(this, arguments);
          window.dispatchEvent(new Event('locationchange'));
          return result;
        };
        
        window.addEventListener('popstate', function() {
          window.dispatchEvent(new Event('locationchange'));
        });

        let lastTrackedUrl = '';
        let lastTrackedTitle = '';

        window.addEventListener('locationchange', function() {
          const currentUrl = window.location.pathname + window.location.search;
          const currentTitle = document.title;
          
          if (currentUrl === lastTrackedUrl && currentTitle === lastTrackedTitle) {
            return;
          }
          lastTrackedUrl = currentUrl;
          lastTrackedTitle = currentTitle;
          
          if (typeof window.gtag === 'function') {
            window.gtag('event', 'page_view', {
              page_path: currentUrl,
              page_title: currentTitle
            });
          }
        });
      })();
    </script>
  </head>
  <body>
